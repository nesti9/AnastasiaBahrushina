  <rect x="1342" y="32" width="180" height="42" rx="21" fill="none" stroke="#b8c5b6"/><text x="1432" y="58" text-anchor="middle" font-size="11" fill="#18392f" font-weight="700">Задать вопрос　→</text>
  <path d="M76 101H1524" stroke="#d9ddd3"/>
