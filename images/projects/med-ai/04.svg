  <text x="770" y="428" font-size="15" fill="#c3d0c5">Если вопрос требует подробностей, откройте каталог</text>
  <text x="770" y="454" font-size="15" fill="#c3d0c5">интернет-магазина, раздел анализов или страницу клиники Med.</text>
  <path d="M770 504H1500" stroke="#47695d"/>
  <text x="776" y="551" font-family="Georgia,serif" font-size="18" fill="#c9bb93">01</text><text x="835" y="551" font-size="16" font-weight="700" fill="#f6f5ed">Интернет-магазин</text><text x="835" y="577" font-size="12" fill="#b7c8bb">Товары и наличие</text><text x="1488" y="558" text-anchor="end" font-size="18" fill="#c9bb93">↗</text>
  <path d="M770 604H1500" stroke="#47695d"/>
  <text x="776" y="651" font-family="Georgia,serif" font-size="18" fill="#c9bb93">02</text><text x="835" y="651" font-size="16" font-weight="700" fill="#f6f5ed">Анализы</text><text x="835" y="677" font-size="12" fill="#b7c8bb">Лабораторные исследования</text><text x="1488" y="658" text-anchor="end" font-size="18" fill="#c9bb93">↗</text>
  <path d="M770 704H1500" stroke="#47695d"/>
  <text x="776" y="751" font-family="Georgia,serif" font-size="18" fill="#c9bb93">03</text><text x="835" y="751" font-size="16" font-weight="700" fill="#f6f5ed">Клиника Med</text><text x="835" y="777" font-size="12" fill="#b7c8bb">Медицинские услуги</text><text x="1488" y="758" text-anchor="end" font-size="18" fill="#c9bb93">↗</text>
  <path d="M770 804H1500" stroke="#47695d"/>
