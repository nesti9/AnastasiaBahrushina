    <rect x="368" y="678" width="150" height="38" rx="19" fill="#fffefa" stroke="#dce2d9"/><text x="443" y="702" text-anchor="middle" font-size="10" fill="#52665a">Узнать о товаре</text>
    <rect x="218" y="731" width="300" height="95" rx="18" fill="#fffefa" stroke="#dfe4dc"/><text x="238" y="766" font-size="11" fill="#9aa59b">Напишите, что вас интересует…</text><path d="M238 781H500" stroke="#ecece5"/><text x="238" y="811" font-size="8" fill="#9ba59b">Ответы носят справочный характер</text><circle cx="492" cy="803" r="15" fill="#245943"/><path d="M485 803h12m-5-5 5 5-5 5" fill="none" stroke="#fffefa" stroke-width="1.5"/>
