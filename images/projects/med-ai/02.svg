    <text x="220" y="183" font-family="Georgia,serif" font-size="24">Med AI</text><circle cx="241" cy="202" r="4" fill="#91af78"/><text x="254" y="206" font-size="10" fill="#718176">Помощник на связи</text><path d="M215 223H523" stroke="#e3e1d8"/>
