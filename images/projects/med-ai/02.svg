    <circle cx="230" cy="592" r="8" fill="none" stroke="#47735c"/><path d="m226 592 3 3 6-7" fill="none" stroke="#47735c" stroke-width="1.5"/><text x="247" y="596" font-size="9" fill="#748276">Справочная информация</text>
